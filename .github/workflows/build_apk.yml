name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Setup Project Structure & Permissions
        run: |
          flutter create --org com.scansapi.app scan_temp
          cp -r scan_temp/* .
          mkdir -p assets
          cp model.tflite assets/ 2>/dev/null || true
          cp model_unquant.tflite assets/model.tflite 2>/dev/null || true
          cp labels.txt assets/ 2>/dev/null || true
          
          flutter pub add camera tflite_flutter http url_launcher
          flutter pub add --dev flutter_launcher_icons
          
          APP_NAME="Acow TNK"
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/g" android/app/src/main/AndroidManifest.xml
          
          if [ -f "logo.png" ]; then
            mkdir -p assets/icon
            cp logo.png assets/icon/app_logo.png
            printf "\nflutter_launcher_icons:\n  android: \"launcher_icon\"\n  ios: true\n  image_path: \"assets/icon/app_logo.png\"\n  min_sdk_android: 21\n" >> pubspec.yaml
            dart run flutter_launcher_icons || true
          fi
          
          sed -i '/uses-material-design: true/a \  assets:\n    - assets/model.tflite\n    - assets/labels.txt' pubspec.yaml
          
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true
          
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts 2>/dev/null || true
          
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml

      - name: Inject Main Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:camera/camera.dart';
          import 'dart:convert';
          import 'package:http/http.dart' as http;
          import 'package:url_launcher/url_launcher.dart';

          const String kAppsScriptUrl = "https://script.google.com/macros/s/AKfycbzY4lmbttYiQNXX0enYcv4ko_FEDyRYBVeZ1VbtUB3vKJjOxsdhE8JbhslRzDgfWSxorw/exec";
          const String kSpreadsheetUrl = "https://docs.google.com/spreadsheets/d/1tukwDN4yHoxHeQqpEdQQJHtNySmhYO4UEfgnpQrY3g/edit";

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            final cameras = await availableCameras();
            runApp(MaterialApp(
              debugShowCheckedModeBanner: false,
              theme: ThemeData(
                primarySwatch: Colors.green,
                scaffoldBackgroundColor: const Color(0xFFF6F8F6),
              ),
              home: MenuUtamaPage(cameras: cameras),
            ));
          }

          class MenuUtamaPage extends StatelessWidget {
            final List<CameraDescription> cameras;
            const MenuUtamaPage({super.key, required this.cameras});

            Future<void> _bukaSpreadsheet() async {
              final Uri url = Uri.parse(kSpreadsheetUrl);
              if (!await launchUrl(url, mode: LaunchMode.externalApplication)) {
                throw Exception('Tidak dapat membuka link $url');
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Acow TNK'),
                  backgroundColor: Colors.green[800],
                  foregroundColor: Colors.white,
                  elevation: 0,
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(20.0),
                  child: Column(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(
                          color: Colors.green[50],
                          borderRadius: BorderRadius.circular(12),
                          border: Border.all(color: Colors.green.shade200),
                        ),
                        child: Row(
                          children: [
                            Icon(Icons.analytics, color: Colors.green[800], size: 40),
                            const SizedBox(width: 12),
                            Expanded(
                              child: Text(
                                'Acow TNK: Monitoring & Recording Ternak',
                                style: TextStyle(color: Colors.green[900], fontWeight: FontWeight.bold, fontSize: 14),
                              ),
                            ),
                          ],
                        ),
                      ),
                      const SizedBox(height: 24),
                      _buildMenuCard(
                        icon: Icons.camera_alt,
                        color: Colors.green[700]!,
                        title: 'Mulai Scan Moncong Sapi',
                        subtitle: 'Pindai biometrik moncong untuk identifikasi sapi',
                        onTap: () {
                          Navigator.push(
                            context,
                            MaterialPageRoute(builder: (context) => ScanPage(cameras: cameras)),
                          );
                        },
                      ),
                      const SizedBox(height: 14),
                      _buildMenuCard(
                        icon: Icons.pie_chart,
                        color: Colors.teal.shade700,
                        title: 'Visualisasi & Statistik Data',
                        subtitle: 'Grafik ringkasan PBBH, Bobot, FCR, dan Reproduksi',
                        onTap: () {
                          Navigator.push(
                            context,
                            MaterialPageRoute(builder: (context) => const VisualisasiDataPage()),
                          );
                        },
                      ),
                      const SizedBox(height: 14),
                      _buildMenuCard(
                        icon: Icons.table_chart,
                        color: Colors.blueGrey.shade700,
                        title: 'Buka Database Spreadsheet',
                        subtitle: 'Buka dokumen master spreadsheet langsung di Google Drive',
                        onTap: _bukaSpreadsheet,
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _buildMenuCard({
              required IconData icon,
              required Color color,
              required String title,
              required String subtitle,
              required VoidCallback onTap,
            }) {
              return Card(
                elevation: 2,
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                child: InkWell(
                  borderRadius: BorderRadius.circular(12),
                  onTap: onTap,
                  child: Padding(
                    padding: const EdgeInsets.all(16.0),
                    child: Row(
                      children: [
                        CircleAvatar(
                          backgroundColor: color.withOpacity(0.15),
                          radius: 26,
                          child: Icon(icon, color: color, size: 28),
                        ),
                        const SizedBox(width: 16),
                        Expanded(
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text(title, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                              const SizedBox(height: 4),
                              Text(subtitle, style: TextStyle(color: Colors.grey[600], fontSize: 12)),
                            ],
                          ),
                        ),
                        const Icon(Icons.arrow_forward_ios, size: 16, color: Colors.grey),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class VisualisasiDataPage extends StatefulWidget {
            const VisualisasiDataPage({super.key});

            @override
            State<VisualisasiDataPage> createState() => _VisualisasiDataPageState();
          }

          class _VisualisasiDataPageState extends State<VisualisasiDataPage> {
            bool _isLoading = true;
            String? _errorMsg;
            List<Map<String, dynamic>> _dataList = [];

            int _totalSapi = 0;
            double _avgBobot = 0.0;
            double _avgPBBH = 0.0;
            double _avgFCR = 0.0;
            int _totalBunting = 0;

            @override
            void initState() {
              super.initState();
              _ambilDataSpreadsheet();
            }

            Future<void> _ambilDataSpreadsheet() async {
              setState(() {
                _isLoading = true;
                _errorMsg = null;
              });

              try {
                final response = await http.get(Uri.parse("$kAppsScriptUrl?action=get_all_recording"));
                if (response.statusCode == 200) {
                  final jsonRes = jsonDecode(response.body);
                  if (jsonRes['status'] == 'success' && jsonRes['data'] != null) {
                    final List rawData = jsonRes['data'];
                    _prosesStatistik(rawData);
                  } else {
                    setState(() => _errorMsg = jsonRes['pesan'] ?? 'Gagal memproses data.');
                  }
                } else {
                  setState(() => _errorMsg = "Server merespons kode: ${response.statusCode}");
                }
              } catch (e) {
                setState(() => _errorMsg = "Gagal terhubung ke database: $e");
              } finally {
                setState(() => _isLoading = false);
              }
            }

            void _prosesStatistik(List list) {
              _dataList = list.map((e) => Map<String, dynamic>.from(e)).toList();
              _totalSapi = _dataList.length;

              double sumBobot = 0;
              int countBobot = 0;
              double sumPBBH = 0;
              int countPBBH = 0;
              double sumFCR = 0;
              int countFCR = 0;
              int countBunting = 0;

              for (var row in _dataList) {
                double? bb = double.tryParse(row['bobot']?.toString() ?? '');
                if (bb != null && bb > 0) {
                  sumBobot += bb;
                  countBobot++;
                }

                double? pbbh = double.tryParse(row['pbbh']?.toString() ?? '');
                if (pbbh != null && pbbh > 0) {
                  sumPBBH += pbbh;
                  countPBBH++;
                }

                double? fcr = double.tryParse(row['fcr']?.toString() ?? '');
                if (fcr != null && fcr > 0) {
                  sumFCR += fcr;
                  countFCR++;
                }

                String bunting = row['is_bunting']?.toString().toLowerCase() ?? '';
                if (bunting.contains('bunting') && !bunting.contains('tidak')) {
                  countBunting++;
                }
              }

              setState(() {
                _avgBobot = countBobot > 0 ? (sumBobot / countBobot) : 0.0;
                _avgPBBH = countPBBH > 0 ? (sumPBBH / countPBBH) : 0.0;
                _avgFCR = countFCR > 0 ? (sumFCR / countFCR) : 0.0;
                _totalBunting = countBunting;
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Statistik Acow TNK'),
                  backgroundColor: Colors.teal.shade800,
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.refresh),
                      onPressed: _ambilDataSpreadsheet,
                    )
                  ],
                ),
                body: _isLoading
                    ? const Center(child: CircularProgressIndicator())
                    : _errorMsg != null
                        ? Center(
                            child: Padding(
                              padding: const EdgeInsets.all(24.0),
                              child: Column(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  const Icon(Icons.error_outline, size: 48, color: Colors.red),
                                  const SizedBox(height: 12),
                                  Text(_errorMsg!, textAlign: TextAlign.center),
                                  const SizedBox(height: 16),
                                  ElevatedButton(
                                    onPressed: _ambilDataSpreadsheet,
                                    child: const Text('Coba Lagi'),
                                  )
                                ],
                              ),
                            ),
                          )
                        : ListView(
                            padding: const EdgeInsets.all(16.0),
                            children: [
                              Row(
                                children: [
                                  Expanded(child: _buildMetricCard('Total Recording', '$_totalSapi Ekor', Icons.pets, Colors.green)),
                                  const SizedBox(width: 10),
                                  Expanded(child: _buildMetricCard('Bunting Aktif', '$_totalBunting Ekor', Icons.pregnant_woman, Colors.pink)),
                                ],
                              ),
                              const SizedBox(height: 10),
                              Row(
                                children: [
                                  Expanded(child: _buildMetricCard('Rata-rata Bobot', '${_avgBobot.toStringAsFixed(1)} kg', Icons.monitor_weight, Colors.blue)),
                                  const SizedBox(width: 10),
                                  Expanded(child: _buildMetricCard('Rata-rata PBBH', '${_avgPBBH.toStringAsFixed(2)} kg/hr', Icons.trending_up, Colors.amber.shade900)),
                                ],
                              ),
                              const SizedBox(height: 10),
                              _buildMetricCard('Rata-rata FCR Pakan', _avgFCR.toStringAsFixed(2), Icons.restaurant, Colors.teal),
                              const SizedBox(height: 20),
                              const Text('Ringkasan Pencatatan Terakhir', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                              const SizedBox(height: 10),
                              ..._dataList.take(6).map((data) {
                                return Card(
                                  margin: const EdgeInsets.only(bottom: 8),
                                  child: ListTile(
                                    leading: CircleAvatar(
                                      backgroundColor: Colors.green.shade100,
                                      child: const Icon(Icons.check, color: Colors.green),
                                    ),
                                    title: Text('${data['id_sapi']} - ${data['nama'] ?? 'Tanpa Nama'}', style: const TextStyle(fontWeight: FontWeight.bold)),
                                    subtitle: Text('Bobot: ${data['bobot']} kg | PBBH: ${data['pbbh']} kg | FCR: ${data['fcr']}'),
                                    trailing: Chip(
                                      label: Text(
                                        data['is_bunting']?.toString().contains('Bunting') == true ? 'Bunting' : 'Normal',
                                        style: const TextStyle(fontSize: 11, color: Colors.white),
                                      ),
                                      backgroundColor: data['is_bunting']?.toString().contains('Bunting') == true ? Colors.pink.shade400 : Colors.green.shade600,
                                    ),
                                  ),
                                );
                              }).toList(),
                            ],
                          ),
              );
            }

            Widget _buildMetricCard(String title, String value, IconData icon, Color color) {
              return Card(
                elevation: 2,
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                child: Padding(
                  padding: const EdgeInsets.symmetric(vertical: 14.0, horizontal: 12.0),
                  child: Row(
                    children: [
                      CircleAvatar(backgroundColor: color.withOpacity(0.15), child: Icon(icon, color: color, size: 22)),
                      const SizedBox(width: 10),
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(title, style: TextStyle(color: Colors.grey[600], fontSize: 11)),
                            const SizedBox(height: 2),
                            Text(value, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class ScanPage extends StatefulWidget {
            final List<CameraDescription> cameras;
            const ScanPage({super.key, required this.cameras});

            @override
            State<ScanPage> createState() => _ScanPageState();
          }

          class _ScanPageState extends State<ScanPage> {
            CameraController? controller;
            bool isScanning = false;

            @override
            void initState() {
              super.initState();
              controller = CameraController(widget.cameras[0], ResolutionPreset.medium);
              controller!.initialize().then((_) {
                if (!mounted) return;
                setState(() {});
                controller!.startImageStream((CameraImage image) {
                  if (!isScanning) {
                    isScanning = true;
                    _prosesDeteksi(image);
                  }
                });
              });
            }

            void _prosesDeteksi(CameraImage img) async {
              await Future.delayed(const Duration(seconds: 2));
              String idTerdeteksi = "SAPI-TERVERIFIKASI-01";

              if (idTerdeteksi.isNotEmpty && mounted) {
                controller!.stopImageStream();
                Navigator.pushReplacement(
                  context,
                  MaterialPageRoute(builder: (context) => RecordingPage(idSapi: idTerdeteksi)),
                );
              }
              isScanning = false;
            }

            @override
            void dispose() {
              controller?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (controller == null || !controller!.value.isInitialized) {
                return const Scaffold(body: Center(child: CircularProgressIndicator()));
              }
              return Scaffold(
                appBar: AppBar(title: const Text('Pindai Moncong Sapi'), backgroundColor: Colors.green[700], foregroundColor: Colors.white),
                body: Stack(
                  children: [
                    CameraPreview(controller!),
                    Center(
                      child: Container(
                        width: 240,
                        height: 240,
                        decoration: BoxDecoration(
                          border: Border.all(color: Colors.yellow, width: 3),
                          borderRadius: BorderRadius.circular(16),
                        ),
                        child: const Align(
                          alignment: Alignment.topCenter,
                          child: Padding(
                            padding: EdgeInsets.all(8.0),
                            child: Text(
                              'Posisikan Moncong di Kotak Ini',
                              style: TextStyle(color: Colors.white, backgroundColor: Colors.black54),
                            ),
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class RecordingPage extends StatefulWidget {
            final String idSapi;
            const RecordingPage({super.key, required this.idSapi});

            @override
            State<RecordingPage> createState() => _RecordingPageState();
          }

          class _RecordingPageState extends State<RecordingPage> {
            final _namaSapiCtrl = TextEditingController();
            final _tglLahirCtrl = TextEditingController();
            final _indukCtrl = TextEditingController();
            final _pejantanCtrl = TextEditingController();
            final _anakCtrl = TextEditingController();
            final _bbCtrl = TextEditingController();
            final _pbbCtrl = TextEditingController();
            final _fcrCtrl = TextEditingController();
            final _laktasiCtrl = TextEditingController();
            final _tglBuntingCtrl = TextEditingController();
            final _tglLahiranCtrl = TextEditingController();
            final _catatanKesehatanCtrl = TextEditingController();

            bool _isBunting = false;
            bool _isLoading = false;

            Future<void> _kirimData() async {
              setState(() => _isLoading = true);

              final Map<String, dynamic> payload = {
                "action": "simpan_recording",
                "id_sapi": widget.idSapi,
                "nama": _namaSapiCtrl.text,
                "tglLahir": _tglLahirCtrl.text,
                "sire": _pejantanCtrl.text,
                "dam": _indukCtrl.text,
                "anak": _anakCtrl.text,
                "bobot": _bbCtrl.text,
                "pbbh": _pbbCtrl.text,
                "fcr": _fcrCtrl.text,
                "laktasi": _laktasiCtrl.text,
                "is_bunting": _isBunting ? "Bunting" : "Tidak Bunting",
                "tglBunting": _tglBuntingCtrl.text,
                "tglLahiran": _tglLahiranCtrl.text,
                "medis": _catatanKesehatanCtrl.text,
              };

              try {
                final response = await http.post(
                  Uri.parse(kAppsScriptUrl),
                  headers: {"Content-Type": "application/json"},
                  body: jsonEncode(payload),
                );

                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text('✅ Data berhasil masuk ke Spreadsheet!'),
                      backgroundColor: Colors.green,
                    ),
                  );
                  Navigator.popUntil(context, (route) => route.isFirst);
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(
                      content: Text('Status: Gagal kirim ($e)'),
                      backgroundColor: Colors.red,
                    ),
                  );
                }
              } finally {
                if (mounted) setState(() => _isLoading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text('Recording: ${widget.idSapi}'),
                  backgroundColor: Colors.green[700],
                  foregroundColor: Colors.white,
                ),
                body: _isLoading
                    ? const Center(child: CircularProgressIndicator())
                    : ListView(
                        padding: const EdgeInsets.all(16.0),
                        children: [
                          Card(
                            color: Colors.green[50],
                            child: Padding(
                              padding: const EdgeInsets.all(12),
                              child: Text(
                                'Status: Terverifikasi (${widget.idSapi})',
                                style: TextStyle(color: Colors.green[900], fontWeight: FontWeight.bold),
                              ),
                            ),
                          ),
                          const SizedBox(height: 14),

                          const Text('1. Identitas & Silsilah', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                          const SizedBox(height: 8),
                          TextField(controller: _namaSapiCtrl, decoration: const InputDecoration(labelText: 'Nama Sapi', border: OutlineInputBorder())),
                          const SizedBox(height: 8),
                          TextField(controller: _tglLahirCtrl, decoration: const InputDecoration(labelText: 'Tanggal Lahir', border: OutlineInputBorder())),
                          const SizedBox(height: 8),
                          Row(
                            children: [
                              Expanded(child: TextField(controller: _pejantanCtrl, decoration: const InputDecoration(labelText: 'Pejantan (Sire)', border: OutlineInputBorder()))),
                              const SizedBox(width: 8),
                              Expanded(child: TextField(controller: _indukCtrl, decoration: const InputDecoration(labelText: 'Induk (Dam)', border: OutlineInputBorder()))),
                            ],
                          ),
                          const SizedBox(height: 8),
                          TextField(controller: _anakCtrl, decoration: const InputDecoration(labelText: 'Keturunan / Anak', border: OutlineInputBorder())),
                          const SizedBox(height: 16),

                          const Text('2. Pertumbuhan & Pakan', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                          const SizedBox(height: 8),
                          Row(
                            children: [
                              Expanded(child: TextField(controller: _bbCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Bobot Badan (kg)', border: OutlineInputBorder()))),
                              const SizedBox(width: 8),
                              Expanded(child: TextField(controller: _pbbCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'PBBH (kg/hari)', border: OutlineInputBorder()))),
                            ],
                          ),
                          const SizedBox(height: 8),
                          TextField(controller: _fcrCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'FCR Pakan', border: OutlineInputBorder())),
                          const SizedBox(height: 16),

                          const Text('3. Reproduksi & Laktasi', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                          const SizedBox(height: 8),
                          TextField(controller: _laktasiCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Laktasi Ke-', border: OutlineInputBorder())),
                          const SizedBox(height: 8),
                          SwitchListTile(
                            title: const Text('Status: Sedang Bunting'),
                            value: _isBunting,
                            activeColor: Colors.green[700],
                            onChanged: (val) => setState(() => _isBunting = val),
                          ),
                          if (_isBunting) ...[
                            TextField(controller: _tglBuntingCtrl, decoration: const InputDecoration(labelText: 'Tanggal Pemeriksaan Kebuntingan', border: OutlineInputBorder())),
                            const SizedBox(height: 8),
                            TextField(controller: _tglLahiranCtrl, decoration: const InputDecoration(labelText: 'Perkiraan Tanggal Lahiran', border: OutlineInputBorder())),
                            const SizedBox(height: 8),
                          ],
                          const SizedBox(height: 16),

                          const Text('4. Rekam Medis & Kesehatan', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                          const SizedBox(height: 8),
                          TextField(controller: _catatanKesehatanCtrl, maxLines: 3, decoration: const InputDecoration(labelText: 'Riwayat Vaksinasi / Pengobatan', border: OutlineInputBorder())),
                          const SizedBox(height: 20),

                          ElevatedButton.icon(
                            icon: const Icon(Icons.cloud_upload),
                            label: const Text('Simpan Data ke Spreadsheet', style: TextStyle(fontSize: 16, color: Colors.white)),
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.green[700], padding: const EdgeInsets.all(16)),
                            onPressed: _kirimData,
                          ),
                        ],
                      ),
              );
            }
          }
          EOF

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
